version: '3.8'

services:
  # 1. Database Layer (PostgreSQL with TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=${DB_NAME:-rebalancer}
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fullstack_secured_2026}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d # Auto-executes schema.sql and ml_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-rebalancer}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. On-Chain Environment (Anvil Mainnet Fork)
  anvil:
    build: .
    command: anvil --fork-url https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY} --host 0.0.0.0 --port 8545
    ports:
      - "8545:8545"
    environment:
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' http://localhost:8545 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. AI Rebalancer Engine (The Backend)
  rebalancer:
    build: .
    depends_on:
      db:
        condition: service_healthy
      anvil:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-fullstack_secured_2026}@db:5432/${DB_NAME:-rebalancer}
      - RPC_URL=http://anvil:8545
      - ETHEREUM_RPC_URL=http://anvil:8545
      - BASE_RPC_URL=http://anvil:8545
      - NETWORK=local
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - KEEPER_PRIVATE_KEY=${KEEPER_PRIVATE_KEY}
      - DEPLOYER_PRIVATE_KEY=${KEEPER_PRIVATE_KEY}
      - STRATEGY_HUB_ADDRESS=${STRATEGY_HUB_ADDRESS:-}
      - DUNE_API_KEY=${DUNE_API_KEY}
    volumes:
      - ./data:/app/data
      - ./contracts:/app/contracts
      - ./models:/app/models
      - ./models:/app/models
    command: >
      bash -c "
        export PYTHONPATH=/app &&
        echo '🚢 Phase 1: Deploying Smart Contracts...' &&
        python3 scripts/start_local_fork.py &&
        echo '📊 Phase 1.5: Seeding Database...' &&
        python3 src/scheduler/collector.py --once &&
        
        echo '🧠 Starting Rebalancer Agent Loop...' &&
        # Start Data Collector & Rebalancer in parallel
        python3 src/scheduler/collector.py &
        python3 src/scheduler/rebalancer_loop.py &
        wait
      "

  # 3b. AI Brain (API Server)
  brain:
    build: .
    depends_on:
      db:
        condition: service_healthy
      anvil:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-fullstack_secured_2026}@db:5432/${DB_NAME:-rebalancer}
      - RPC_URL=http://anvil:8545
      - ETHEREUM_RPC_URL=http://anvil:8545
      - BASE_RPC_URL=http://anvil:8545
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
    volumes:
      - ./data:/app/data
      - ./contracts:/app/contracts
      - ./models:/app/models
    ports:
      - "8000:8000"
    command: >
      bash -c "
        export PYTHONPATH=/app &&
        uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --reload
      "

  # 4. Analytics Front-end (Streamlit Dashboard)
  dashboard:
    build: .
    # Note: Inside Docker, Nginx communicates via port 8501
    depends_on:
      db:
        condition: service_healthy
      anvil:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-fullstack_secured_2026}@db:5432/${DB_NAME:-rebalancer}
      - RPC_URL=http://anvil:8545
      - ETHEREUM_RPC_URL=http://anvil:8545
      - BASE_RPC_URL=http://anvil:8545
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - BRAIN_API_HOST=brain
    volumes:
      - ./data:/app/data
      - ./contracts:/app/contracts
      - ./models:/app/models
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.enableCORS false --server.enableXsrfProtection false

  # 5. Production Gateway (Nginx)
  gateway:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deployments/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - dashboard

  # 6. SSL Automator (Certbot)
  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  timescale_data:
  data:
  contracts:
  models:
